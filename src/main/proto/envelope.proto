syntax = "proto3";
package iov.vagw.v1;

option java_package = "net.hwyz.iov.cloud.edd.vagw.proto";
option java_outer_classname = "EnvelopeProto";

message Envelope {
  uint32      ver         = 1;
  string      msg_id      = 2;
  string      device_sn   = 3;
  string      service     = 4;
  MsgType     msg_type    = 5;
  int64       ts          = 6;
  uint64      seq         = 7;
  uint32      ttl_ms      = 8;
  Compression compression = 9;
  string      correlation_id = 10;
  string      causation_id   = 11;
  string      trace_id       = 12;
  string      idempotency_key = 13;
  bytes       payload_digest = 14;
  bytes       payload     = 15; // 业务负载；FOTA 为 OTA 契约 bytes（对 VAGW 不透明）
  string      vin         = 16; // VIN：北向富化 / 下行 Kafka Key 一致性校验
}

enum MsgType {
  MSG_TYPE_UNSPECIFIED = 0;
  UP_DATA = 1;
  DOWN_CMD = 2;
  UP_ACK = 3;
}

enum Compression {
  COMPRESSION_NONE = 0;
  GZIP = 1;
}
