spring:
  application:
    name: vagw
  kafka:
    producer:
      acks: all                 # 至少一次 / 幂等生产（EDD-VAGW-DSN-CR-012 §3.5）
      properties:
        enable.idempotence: true

# FOTA 透明桥接配置（EDD-VAGW-DSN-CR-006 §5/§10 + EDD-VAGW-DSN-CR-008）
# VAGW 作为 Producer 的 4 个 Topic：vagw.fota / vagw.fota.delivery / vagw.fota.dlq.up / vagw.fota.dlq.down
# （名称见 VagwFotaTopicProperties，生产环境经 Nacos 覆盖）；FOTA 下行业务 Topic iov.vagw.down.fota
# 由 IOV-OTA 生产、VAGW 消费，消费组 edd-vagw-fota-downlink；
# 协议 major 与 manifest 不一致时启动 fail-closed（ProtocolContractGuard）。
iov:
  kafka:
    topic-provisioning:
      enabled: true    # FW-KAFKA：启动时检查并幂等创建 VAGW 生产的 4 个 FOTA Topic（CR-008 §3）

vagw:
  kafka:
    topic-provisioning:
      partitions: 3
      replication-factor: 1
    # 设备上线事件（EDD-VAGW-DSN-CR-012）：VAGW Producer → vagw.device.online，Key=hsmUid，
    # Redis Stream Outbox 至少一次发布 + 会话对账；Topic 纳入 FW-KAFKA Provisioning Catalog。
    device-online:
      topic: vagw.device.online
      enabled: true
      outbox-batch-size: 100
      publish-timeout: 3s
      dedup-ttl: 7d            # eventId 去重/对账标记保留时长
      lease-timeout: 30s       # pending 租约：超时可被其他实例认领（多实例条件抢占）
      backoff-initial: 5s
      backoff-max: 5m
      persist-retry-attempts: 3
      persist-retry-backoff: 50ms
      reconcile-interval-ms: 60000
      publish-interval-ms: 5000
      admission-ttl-seconds: 300
      partitions: 0            # 0=继承 vagw.kafka.topic-provisioning.partitions
      replication-factor: 0    # 0=继承 vagw.kafka.topic-provisioning.replication-factor
      # fail-closed 后主动断连（可选）：配置 EMQX 管理面凭据后启用
      emqx-api:
        enabled: false
        base-url: ""
        api-key: ""
        api-secret: ""
    fota:
      uplink-topic: vagw.fota
      delivery-topic: vagw.fota.delivery
      uplink-dlq-topic: vagw.fota.dlq.up
      downlink-dlq-topic: vagw.fota.dlq.down
      downlink-concurrency: 3
  fota:
    protocol-major: 1
    max-envelope-bytes: 262144        # 上限不截断、不自动分片；超限进 DLQ
    max-payload-bytes: 262016
    uplink-produce-retries: 3
    uplink-produce-retry-delay-ms: 500
  # 绑定解析配置（EDD-VAGW-DSN-CR-007 §8）：缓存有界 TTL，未命中回源 TSP；
  # 不做长期负缓存（negative-cache-ttl 恒为 0）
  binding:
    cache-ttl-seconds: 300
  # keyprov 能力与门禁（EDD-VAGW-DSN-CR-011 §4/§10）：量产默认 false。
  # 关闭或 proto-keyprov 契约不兼容时，VAGW 不授予任何 keyprov ACL，也不受理 keyprov 上行，
  # 且不影响 FOTA/远控等其他 service；仅当 PAR-PROTO/VAGW/VMD/EMQX/TBOX release-set
  # 全部兼容后才开启。开启前须完成真实 SUBACK 与 Request/Response、Ack/AckResult、
  # Status/StatusResponse 端到端测试。
  keyprov:
    enabled: false
    protocol-version: keyprov-v1
    service: security.keyprov
    max-payload-bytes: 16384          # Envelope.payload 上限：超限整体拒绝，不截断/不分片
    max-envelope-bytes: 17408         # 上行原始 Envelope bytes 上限（payload + 结构开销）
    qos: 1
    # 上行独立共享订阅组；FOTA 订阅已收窄为 $queue/vehicle/+/up/fota，避免重复投递
    ingress-shared-subscription: "$share/vagw-keyprov/vehicle/+/up/keyprov"
    # VMD relay SPI：默认注入 DisabledVmdKeyProvisioningClient（fail-closed，不直连 KMS）。
    # 待 VMD 正式 CR 提供真实 VmdKeyProvisioningClient Bean 后自动覆盖，无需改动 relay 编排。
  # 认证安全（EDD-VAGW-DSN-CR-009 §2.6/§5/§9 + EDD-VAGW-DSN-CR-010）：VAGW 自身连接超级用户 bypass 四因子配置。
  # 默认关闭（最安全）：未显式开启并配齐全部因子时，任何连接都不授予 superuser，
  # 也绝不回退到仅凭 clientId 前缀放行（原前缀放行存在外部伪造提权风险，已移除）。
  # 服务凭据因子为双模式（EDD-VAGW-DSN-CR-010）：
  #   - mTLS 模式：配置 service-cert-cn（专属 VAGW 服务证书 CN，校验 peer_cert_cn，优先于账号模式）
  #   - 明文账号模式（当前 1883 内网部署）：配置 service-username + service-password（成对，Secret 注入）
  # 生产启用示例（明文账号模式）：
  # auth:
  #   bypass:
  #     enabled: true
  #     peer-host-cidrs:
  #       - "10.42.0.0/24"               # VAGW MQTT 客户端源 IPv4/CIDR（必配；不是 EMQX 主机名）
  #     service-username: "vagw-service"
  #     service-password: "${VAGW_MQTT_SERVICE_PASSWORD}"
  #     client-id-prefix: "vehicle-access-gateway"
  # 生产启用示例（mTLS 模式）：将 service-cert-cn 配置为服务证书 CN，其余同明文模式
  # 第四因子“独立 internal listener”无法从 HTTP authn 请求中区分，须由 EMQX 网络隔离保证
  # （仅 internal listener 可达 VAGW 自身连接、TBOX 外部 listener 永不授予 bypass），作为部署前置登记。
  # 配置校验：enabled=true 时，peer-host-cidrs 非空且服务凭据模式完整（证书 CN，或账号+口令成对），
  # 否则启动 fail-fast。

# TSP Device Admission Service configuration
tsp:
  device-admission:
    url: http://tsp-service:8080

feign:
  client:
    config:
      tsp-device-admission:
        connectTimeout: 500
        readTimeout: 500
        loggerLevel: basic
      tsp-vehicle-access-identity:
        connectTimeout: 500
        readTimeout: 500
        loggerLevel: basic
  circuitbreaker:
    enabled: true
