spring:
  application:
    name: vagw

# FOTA bridge configuration (EDD-VAGW-DSN-CR-005)
# Topic 固定：iov.vagw.up.fota / iov.vagw.down.fota / .dlq（见 FotaRouteConfig），消费组 edd-vagw-fota-downlink
vagw:
  kafka:
    fota:
      downlink-concurrency: 3

# TSP Device Admission Service configuration
tsp:
  device-admission:
    url: http://tsp-service:8080

# KMS Key Prov Service configuration
kms:
  keyprov:
    url: http://kms-service:8080
    connect-timeout: 1000
    read-timeout: 5000

feign:
  client:
    config:
      tsp-device-admission:
        connectTimeout: 500
        readTimeout: 500
        loggerLevel: basic
      kms-keyprov:
        connectTimeout: 1000
        readTimeout: 5000
        loggerLevel: basic
  circuitbreaker:
    enabled: true
