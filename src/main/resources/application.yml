spring:
  application:
    name: vagw
  kafka:
    producer:
      acks: all                 # 至少一次 / 幂等生产（EDD-VAGW-DSN-CR-012 §3.5）
      retries: 2147483647       # 幂等 Producer 必须 retries>0，防止共享配置下发 0
      # Value 为原始字节（Proto Envelope / DeviceOnlineEvent JSON bytes），Key 为 String：
      # 若共享 kafka.yaml 覆盖为非 ByteArray，由 VagwKafkaPropertiesNormalizer 兜底归一化
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true
    consumer:
      # FOTA 下行 ConsumerRecord<String, byte[]>
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
  # OpenFeign（Spring Cloud 2022/OpenFeign 4.0）：官方 edd-vmd-api Keyprov Service 专属超时。
  # EDD-VAGW-DSN-CR-016 §2.4：统一 absolute deadline；不实现 per-client 连接池，
  # 并发连接上限由 Keyprov bulkhead max-in-flight 约束；loggerLevel 固定 basic，
  # 禁止 body/FULL 日志，避免 canonical payload 进入日志。
  cloud:
    openfeign:
      client:
        config:
          vmdKeyProvisioningService:
            connectTimeout: 500
            readTimeout: 2000
            loggerLevel: basic

# FOTA 透明桥接配置（EDD-VAGW-DSN-CR-006 §5/§10 + EDD-VAGW-DSN-CR-008）
# VAGW 作为 Producer 的 4 个 Topic：vagw.fota / vagw.fota.delivery / vagw.fota.dlq.up / vagw.fota.dlq.down
# （名称见 VagwFotaTopicProperties，生产环境经 Nacos 覆盖）；FOTA 下行业务 Topic iov.vagw.down.fota
# 由 IOV-OTA 生产、VAGW 消费，消费组 edd-vagw-fota-downlink；
# 协议 major 与 manifest 不一致时启动 fail-closed（ProtocolContractGuard）。
iov:
  kafka:
    topic-provisioning:
      enabled: true    # FW-KAFKA：启动时检查并幂等创建 VAGW 生产的 4 个 FOTA Topic（CR-008 §3）

vagw:
  kafka:
    topic-provisioning:
      partitions: 3
      replication-factor: 1
    # 设备上线事件（EDD-VAGW-DSN-CR-012）：VAGW Producer → vagw.device.online，Key=hsmUid，
    # Redis Stream Outbox 至少一次发布 + 会话对账；Topic 纳入 FW-KAFKA Provisioning Catalog。
    device-online:
      topic: vagw.device.online
      enabled: true
      outbox-batch-size: 100
      publish-timeout: 3s
      dedup-ttl: 7d            # eventId 去重/对账标记保留时长
      lease-timeout: 30s       # pending 租约：超时可被其他实例认领（多实例条件抢占）
      backoff-initial: 5s
      backoff-max: 5m
      persist-retry-attempts: 3
      persist-retry-backoff: 50ms
      reconcile-interval-ms: 60000
      publish-interval-ms: 5000
      admission-ttl-seconds: 300
      partitions: 0            # 0=继承 vagw.kafka.topic-provisioning.partitions
      replication-factor: 0    # 0=继承 vagw.kafka.topic-provisioning.replication-factor
      # fail-closed 后主动断连（可选）：配置 EMQX 管理面凭据后启用
      emqx-api:
        enabled: false
        base-url: ""
        api-key: ""
        api-secret: ""
    fota:
      uplink-topic: vagw.fota
      delivery-topic: vagw.fota.delivery
      uplink-dlq-topic: vagw.fota.dlq.up
      downlink-dlq-topic: vagw.fota.dlq.down
      downlink-concurrency: 3
  # 统一 MQTT 上行共享订阅组（EDD-VAGW-DSN-CR-015 §3）：
  # 所有受治理 service 的显式上行 filter 由 VagwUplinkSubscriptionRegistry 统一生成 $share/vagw/{filter}；
  # 禁止已废弃的无组名兼容语法与按业务拆分的旧共享组，禁止 vehicle/+/up/+ 或 vehicle/+/up/# 宽泛通配。
  # enabled 与对应 capability/feature gate 保持一致；共享组只表达部署单元内实例竞争消费，不合并业务链路。
  mqtt:
    shared-group: vagw
    uplink-subscriptions:
      - service: fota
        filter: vehicle/+/up/fota
        qos: 1
        enabled: ${vagw.fota.enabled:true}
      - service: security.keyprov
        filter: vehicle/+/up/keyprov
        qos: 1
        enabled: ${vagw.keyprov.enabled:true}
  fota:
    enabled: true
    protocol-major: 1
    max-envelope-bytes: 262144        # 上限不截断、不自动分片；超限进 DLQ
    max-payload-bytes: 262016
    uplink-produce-retries: 3
    uplink-produce-retry-delay-ms: 500
  # 设备准入（EDD-VAGW-DSN-CR-013 §7）
  # 超时预算基线：framework PKI total-timeout=1s ≤ VAGW→TSP read-timeout(1.5s)-250ms
  # ≤ EMQX→VAGW HTTP auth timeout(≥2s)-500ms；读超时代表结果未知，不做第二次 /decide。
  admission:
    peer-certificate:
      required: true        # 生产固定 true；false 时设备准入 NOT_READY/拒绝，绝不回退仅凭 CN 的 ALLOW
      max-der-bytes: 8192   # 解析前后 DER 上限，超限 fail-closed，不截断
      # 入站证书编码能力声明（EDD-VAGW-DSN-CR-014 §8）：启动校验必须恰好为 [PEM, BASE64_DER]，
      # 缺失/未知/重复即启动失败；不作为灰度或降级开关，运行时始终同时启用两种解析能力，不支持动态刷新。
      accepted-encodings: [PEM, BASE64_DER]
    tsp:
      path: /api/service/deviceAdmission/v1/decide
      connect-timeout: 250ms
      read-timeout: 1500ms
      retry-on-read-timeout: false
    emqx-auth:
      required-timeout: 2s  # EMQX → VAGW HTTP authn 回调预算（部署前置）
  # 绑定解析配置（EDD-VAGW-DSN-CR-007 §8）：缓存有界 TTL，未命中回源 TSP；
  # 不做长期负缓存（negative-cache-ttl 恒为 0）
  binding:
    cache-ttl-seconds: 300
  # keyprov 能力与门禁（EDD-VAGW-DSN-CR-011，由 EDD-VAGW-DSN-CR-016 增量修订）：量产默认启用。
  # 显式关闭时不注册 Keyprov ACL／上行 filter／executor／Gateway 调用链，且不影响 FOTA/远控等
  # 其他 service。enabled=true 时必须存在 edd-vmd-api 官方 VmdKeyProvisioningService
  # Feign Bean（缺失即 fail-fast，不创建 Disabled Client 或第二套自定义 Feign 契约）。
  # 容量/deadline/熔断为保守 dev/CI 默认值，生产经环境变量覆盖。
  keyprov:
    enabled: ${VAGW_KEYPROV_ENABLED:true}
    protocol-version: keyprov-v1
    service: security.keyprov
    max-payload-bytes: 16384          # Envelope.payload 上限：超限整体拒绝，不截断/不分片
    max-envelope-bytes: 17408         # 上行原始 Envelope bytes 上限（payload + 结构开销）
    qos: 1
    # Keyprov 专属并发与超时策略（CR-016 §2/§4）：不实现 per-client 连接池；
    # max-in-flight 是并发请求硬上限，底层连接池可共享，但容量/超时/熔断/指标必须隔离。
    max-in-flight: ${VAGW_KEYPROV_MAX_IN_FLIGHT:32}
    worker-count: ${VAGW_KEYPROV_WORKER_COUNT:0}       # 0 = 跟随 max-in-flight
    queue-capacity: ${VAGW_KEYPROV_QUEUE_CAPACITY:0}   # 默认零等待（SynchronousQueue）
    queue-wait: ${VAGW_KEYPROV_QUEUE_WAIT:0ms}         # 默认不等待，许可耗尽立即拒绝
    vmd:
      deadline: ${VAGW_KEYPROV_VMD_DEADLINE:2s}
    circuit-breaker:
      enabled: true
      failure-window: ${VAGW_KEYPROV_CB_FAILURE_WINDOW:30s}
      open-duration: ${VAGW_KEYPROV_CB_OPEN_DURATION:15s}
      half-open-probes: ${VAGW_KEYPROV_CB_HALF_OPEN_PROBES:2}
      minimum-calls: ${VAGW_KEYPROV_CB_MINIMUM_CALLS:5}
      failure-rate-threshold: ${VAGW_KEYPROV_CB_FAILURE_RATE_THRESHOLD:0.5}
  # 认证安全（EDD-VAGW-DSN-CR-009 §2.6/§5/§9 + EDD-VAGW-DSN-CR-010）：VAGW 自身连接超级用户 bypass 四因子配置。
  # 默认关闭（最安全）：未显式开启并配齐全部因子时，任何连接都不授予 superuser，
  # 也绝不回退到仅凭 clientId 前缀放行（原前缀放行存在外部伪造提权风险，已移除）。
  # 服务凭据因子为双模式（EDD-VAGW-DSN-CR-010）：
  #   - mTLS 模式：配置 service-cert-cn（专属 VAGW 服务证书 CN，校验 peer_cert_cn，优先于账号模式）
  #   - 明文账号模式（当前 1883 内网部署）：配置 service-username + service-password（成对，Secret 注入）
  # 生产启用示例（明文账号模式）：
  # auth:
  #   bypass:
  #     enabled: true
  #     peer-host-cidrs:
  #       - "10.42.0.0/24"               # VAGW MQTT 客户端源 IPv4/CIDR（必配；不是 EMQX 主机名）
  #     service-username: "vagw-service"
  #     service-password: "${VAGW_MQTT_SERVICE_PASSWORD}"
  #     client-id-prefix: "vehicle-access-gateway"
  # 生产启用示例（mTLS 模式）：将 service-cert-cn 配置为服务证书 CN，其余同明文模式
  # 第四因子“独立 internal listener”无法从 HTTP authn 请求中区分，须由 EMQX 网络隔离保证
  # （仅 internal listener 可达 VAGW 自身连接、TBOX 外部 listener 永不授予 bypass），作为部署前置登记。
  # 配置校验：enabled=true 时，peer-host-cidrs 非空且服务凭据模式完整（证书 CN，或账号+口令成对），
  # 否则启动 fail-fast。

# TSP Device Admission Service configuration
tsp:
  device-admission:
    url: http://tsp-service:8080

feign:
  client:
    config:
      tsp-device-admission:
        connectTimeout: 250
        readTimeout: 1500
        loggerLevel: basic   # 禁止 body/FULL 日志，避免 PEM/DER 进入日志
      tsp-vehicle-access-identity:
        connectTimeout: 500
        readTimeout: 500
        loggerLevel: basic
  circuitbreaker:
    enabled: true
