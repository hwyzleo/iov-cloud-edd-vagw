spring:
  application:
    name: vagw

# FOTA 透明桥接配置（EDD-VAGW-DSN-CR-006 §5/§10）
# Topic 固定：iov.vagw.up.fota / iov.vagw.down.fota / .dlq / iov.vagw.delivery.fota（见 VehicleRouteCatalog），
# 消费组 edd-vagw-fota-downlink；协议 major 与 manifest 不一致时启动 fail-closed（ProtocolContractGuard）。
vagw:
  kafka:
    fota:
      downlink-concurrency: 3
  fota:
    protocol-major: 1
    max-envelope-bytes: 262144        # 上限不截断、不自动分片；超限进 DLQ
    max-payload-bytes: 262016
    uplink-produce-retries: 3
    uplink-produce-retry-delay-ms: 500
  # 绑定解析配置（EDD-VAGW-DSN-CR-007 §8）：缓存有界 TTL，未命中回源 TSP；
  # 不做长期负缓存（negative-cache-ttl 恒为 0）
  binding:
    cache-ttl-seconds: 300

# TSP Device Admission Service configuration
tsp:
  device-admission:
    url: http://tsp-service:8080

feign:
  client:
    config:
      tsp-device-admission:
        connectTimeout: 500
        readTimeout: 500
        loggerLevel: basic
      tsp-vehicle-access-identity:
        connectTimeout: 500
        readTimeout: 500
        loggerLevel: basic
  circuitbreaker:
    enabled: true
